        document.addEventListener("DOMContentLoaded", () => {
            const locationSelect = document.getElementById("locationFilter");
            const resultsContainer = document.getElementById("resultsContainer");
            const emptyState = document.getElementById("emptyState");
            const jobsList = document.getElementById("jobsList");

            const uniqueLocations = [...new Set(internshipData.map(item => item.location))].sort((a,b) => a === "Head Office (Tangerang)" ? -1 : b === "Head Office (Tangerang)" ? 1 : a.localeCompare(b, "id"));

            uniqueLocations.forEach(loc => {
                const option = document.createElement("option");
                option.value = loc;
                option.textContent = loc;
                locationSelect.appendChild(option);
            });

            locationSelect.addEventListener("change", (e) => {
                const selectedLocation = e.target.value;
                const filteredJobs = internshipData.filter(item => item.location === selectedLocation);

                if (filteredJobs.length > 0) {
                    emptyState.classList.add("hidden");
                    resultsContainer.classList.remove("hidden");

                    jobsList.innerHTML = filteredJobs.map(job => {
                        const mapsQuery = job.isCorporate ? "Cyberpark Karawaci, Kota Tangerang, Banten" : `${job.companyName}, ${job.locationDetail}`;
                        const mapsUrl = job.isCorporate ? "https://maps.app.goo.gl/mioB7W4Kn5jqwmjz8" : job.id === 11 ? "https://maps.app.goo.gl/b8py142mFbXD5iyu9" : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQuery)}`;
                        return `
                        <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" aria-label="Buka Google Maps untuk ${job.companyName}" 
                           class="group bg-white border border-gray-200 hover:border-mppaBlue rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-200 flex items-center gap-4">
                            <div class="w-[100px] h-[100px] min-w-[100px] min-h-[100px] ${job.isCorporate ? 'bg-mppaRed' : 'bg-white'} rounded-xl border border-gray-100 flex items-center justify-center p-2 shadow-sm shrink-0">
                                <img src="${job.logoPath}" alt="${job.brandType}" class="max-h-full max-w-full object-contain">
                            </div>
                            <div class="flex-grow min-w-0">
                                <h4 class="font-bold text-gray-800 text-sm sm:text-base break-words group-hover:text-mppaBlue transition mb-1">
                                    ${job.companyName}
                                </h4>
                                <p class="text-xs sm:text-sm text-gray-500 flex items-start gap-1">
                                    <i class="fa-solid fa-map-pin text-mppaRed shrink-0 mt-0.5"></i>
                                    <span>${job.locationDetail}</span>
                                </p>
                            </div>
                        </a>
                    `;
                    }).join("");
                } else {
                    emptyState.classList.add("hidden");
                    resultsContainer.classList.remove("hidden");
                    jobsList.innerHTML = `
                        <div class="col-span-full text-center py-8 text-gray-400 text-sm">
                            Belum ada lokasi penempatan untuk wilayah <strong>${selectedLocation}</strong> saat ini.
                        </div>
                    `;
                }
            });
        });
    </script>
